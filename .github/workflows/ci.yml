name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run platform:pin
      - run: npm run check
      - run: node --expose-gc --test --test-isolation=none tests/runtime-scale.node.mjs tests/acquisition-retention.node.mjs
      - run: npm run typecheck:native
      - run: npm run build:native
      - run: node --expose-gc --test --test-isolation=none tests/runtime-scale.node.mjs tests/acquisition-retention.node.mjs
      - run: npm run check:native
      - name: Run examples
        run: |
          for example in examples/*.ts; do
            bun run "$example"
          done

  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tools/platform/.browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/platform/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tools/platform --no-audit --no-fund
      - run: node tools/platform/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run platform:pin -- --all
      - run: npm run check:platform
      - name: Exercise platform failure oracles
        run: bun test tests/platform-evidence.test.ts tests/platform-tools.test.ts tests/platform-deno.test.ts tests/platform/browser-worker.test.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: platform-evidence-${{ github.sha }}
          path: docs/benchmarks/results/
          if-no-files-found: error
